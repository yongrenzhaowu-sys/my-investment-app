# Daily Automation Configuration

# アイデア処理設定
max_ideas_per_day: 1  # 1日に処理する投資アイデア数（推奨：1〜3）

# バックテスト設定
backtest:
  lookback_days: 30  # イベント前後のデータ取得日数（日付ごとAPI制限対策）
  holding_days: [1, 3, 5]  # イベント後の保有期間（営業日）
  benchmark: "TOPIX"  # ベンチマーク（TOPIX、日経平均、市場平均）

  # イベントスタディ設定
  event_window:
    before: 5  # イベント前の観測期間（営業日）
    after: 10  # イベント後の観測期間（営業日）
  
  # リターン計算設定
  returns:
    method: "simple"  # simple or log
    adjust_for_splits: true  # 株式分割調整
    adjust_for_dividends: false  # 配当調整（通常は不要）

# フィルタ設定
filters:
  require_tickers: true  # 銘柄コードが抽出できない記事はスキップ
  min_score: 0.3  # アイデアスコアの最低値（0〜1）
  
  # 除外キーワード（ネガティブニュース等）
  exclude_keywords:
    - "不正"
    - "不祥事"
    - "倒産"
    - "破綻"
    - "リコール"
    - "業績下方修正"
  
  # 必須キーワード（ポジティブシグナル）
  # 空の場合はチェックしない
  require_keywords: []

# J-Quants API設定
jquants:
  api_version: "v2"  # v2を使用（APIキー方式）
  cache_days: 30  # キャッシュ保持日数
  retry:
    max_attempts: 3
    backoff_seconds: 5
  
  # レート制限（念のため）
  rate_limit:
    requests_per_second: 2
    requests_per_minute: 100

# 出力設定
output:
  # 日次レポート
  daily_report:
    format: "markdown"  # markdown or html
    include_charts: false  # 初期は軽量化のためfalse
  
  # 知見ファイル
  knowledge:
    auto_generate: true  # 必ず生成
    template: "default"  # テンプレート名
  
  # バックテスト結果
  backtest_metrics:
    format: "json"  # json or csv
    precision: 4  # 小数点以下の桁数

# ログ設定
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/daily_run.log"
  rotation: "daily"  # daily, weekly, size
  retention_days: 30
